services:
  baby-slideshow:
    build: .
    restart: unless-stopped
    env_file: ${SLIDESHOW_ENV_FILE:-.env}
    ports:
      - "${SLIDESHOW_BIND_ADDRESS:-127.0.0.1}:${SLIDESHOW_PORT:-3080}:3000"
    volumes:
      - slideshow_data:/data
      - ./music:/music:ro
    networks:
      - slideshow_edge
      - immich_private
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  slideshow_edge:
    internal: true
  immich_private:
    external: true
    name: ${IMMICH_DOCKER_NETWORK}
volumes:
  slideshow_data:
